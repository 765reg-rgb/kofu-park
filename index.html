<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甲府公園マップ・コンシェルジュ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; overflow: hidden; }
        #map { height: 100%; width: 100%; z-index: 1; }
        .focused-park { border: 3px solid #3b82f6 !important; background-color: #eff6ff !important; transition: all 0.3s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .filter-checkbox:checked + label { background-color: #3b82f6; color: white; border-color: #3b82f6; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col md:flex-row">

    <div class="w-full h-1/2 md:h-full md:w-1/2 relative">
        <div id="map"></div>
    </div>

    <div class="w-full h-1/2 md:h-full md:w-1/2 flex flex-col bg-white shadow-xl z-10">
        
        <div class="p-4 border-b bg-white">
            <h1 class="text-lg font-bold mb-3 text-blue-700">甲府公園ナビ 2026</h1>
            
            <div class="flex flex-wrap gap-2 mb-3">
                <div class="relative flex-grow">
                    <input type="text" id="searchInput" placeholder="公園名で検索..." class="w-full p-2 border rounded-lg text-sm">
                </div>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                <input type="checkbox" id="f-parking" class="hidden filter-checkbox" onchange="updateView()">
                <label for="f-parking" class="px-3 py-1 border rounded-full text-xs font-bold cursor-pointer transition-colors whitespace-nowrap">🚗 駐車場あり</label>

                <input type="checkbox" id="f-toilet" class="hidden filter-checkbox" onchange="updateView()">
                <label for="f-toilet" class="px-3 py-1 border rounded-full text-xs font-bold cursor-pointer transition-colors whitespace-nowrap">🚾 トイレあり</label>

                <input type="checkbox" id="f-playground" class="hidden filter-checkbox" onchange="updateView()">
                <label for="f-playground" class="px-3 py-1 border rounded-full text-xs font-bold cursor-pointer transition-colors whitespace-nowrap">🛝 遊具あり</label>

                <input type="checkbox" id="f-fountain" class="hidden filter-checkbox" onchange="updateView()">
                <label for="f-fountain" class="px-3 py-1 border rounded-full text-xs font-bold cursor-pointer transition-colors whitespace-nowrap">🚰 水飲み場</label>
            </div>
        </div>

        <div id="parkList" class="flex-grow overflow-y-auto p-4 space-y-3">
            </div>
    </div>

    <script>
        const parks = [
            { "id": "11-1", "name": "甲府駅北口多目的広場", "parking": 0, "toilet": true, "playground": false, "area": 4443, "fountain": true, "lat": 35.6675, "lng": 138.5694, "address": "北口2丁目" },
            { "id": "11-2", "name": "遊亀公園", "parking": 42, "toilet": true, "playground": true, "area": 28543, "fountain": true, "lat": 35.6515, "lng": 138.5746, "address": "太田町" },
            { "id": "11-3", "name": "玉諸公園", "parking": 25, "toilet": true, "playground": true, "area": 24000, "fountain": true, "lat": 35.6552, "lng": 138.6045, "address": "国玉町" },
            { "id": "11-4", "name": "朝日公園", "parking": 0, "toilet": true, "playground": true, "area": 1959, "fountain": true, "lat": 35.6726, "lng": 138.5691, "address": "朝日1丁目" },
            { "id": "11-8", "name": "南西土地区画整理1号公園", "parking": 5, "toilet": true, "playground": true, "area": 3000, "fountain": true, "lat": 35.6558, "lng": 138.5532, "address": "上石田4丁目" },
            { "id": "11-30", "name": "甲府市歴史公園", "parking": 0, "toilet": true, "playground": false, "area": 4300, "fountain": true, "lat": 35.6685, "lng": 138.5714, "address": "北口2丁目" },
            { "id": "11-38", "name": "住吉区画整理1号公園", "parking": 6, "toilet": true, "playground": true, "area": 3000, "fountain": true, "lat": 35.6375, "lng": 138.5772, "address": "住吉5丁目" },
            { "id": "11-31", "name": "高畑チビッコ広場", "parking": 0, "toilet": false, "playground": true, "area": 222, "fountain": false, "lat": 35.6508, "lng": 138.5555, "address": "高畑1丁目" }
            // ※11-1〜11-39の座標情報を追加して運用してください
        ];

        // 地図の初期化 (甲府駅中心)
        const map = L.map('map').setView([35.665, 138.57], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let markers = [];

        function updateView() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const condParking = document.getElementById('f-parking').checked;
            const condToilet = document.getElementById('f-toilet').checked;
            const condPlayground = document.getElementById('f-playground').checked;
            const condFountain = document.getElementById('f-fountain').checked;

            // フィルタリング
            const filteredParks = parks.filter(p => {
                const matchSearch = p.name.includes(searchText) || p.address.includes(searchText);
                const matchParking = !condParking || p.parking > 0;
                const matchToilet = !condToilet || p.toilet;
                const matchPlayground = !condPlayground || p.playground;
                const matchFountain = !condFountain || p.fountain;
                return matchSearch && matchParking && matchToilet && matchPlayground && matchFountain;
            });

            renderList(filteredParks);
            renderMarkers(filteredParks);
        }

        function renderList(data) {
            const list = document.getElementById('parkList');
            list.innerHTML = data.map(p => `
                <div id="park-card-${p.id}" class="park-card p-4 border rounded-xl shadow-sm bg-white cursor-pointer" onclick="focusOnMap(${p.lat}, ${p.lng}, '${p.id}')">
                    <h2 class="font-bold text-gray-800">${p.name}</h2>
                    <p class="text-xs text-gray-400 mb-2">${p.address} (#${p.id})</p>
                    <div class="flex gap-2 text-sm">
                        <span class="${p.parking > 0 ? '' : 'grayscale opacity-30'}">🚗${p.parking}</span>
                        <span class="${p.toilet ? '' : 'grayscale opacity-30'}">🚾</span>
                        <span class="${p.playground ? '' : 'grayscale opacity-30'}">🛝</span>
                        <span class="${p.fountain ? '' : 'grayscale opacity-30'}">🚰</span>
                    </div>
                </div>
            `).join('');
        }

        function renderMarkers(data) {
            // 既存のマーカーを削除
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            data.forEach(p => {
                const marker = L.marker([p.lat, p.lng]).addTo(map);
                marker.on('click', () => focusOnList(p.id));
                markers.push(marker);
            });
        }

        function focusOnList(id) {
            const element = document.getElementById(`park-card-${id}`);
            if (element) {
                // 強調表示
                document.querySelectorAll('.park-card').forEach(el => el.classList.remove('focused-park'));
                element.classList.add('focused-park');
                // スクロール
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function focusOnMap(lat, lng, id) {
            map.flyTo([lat, lng], 17);
            focusOnList(id);
        }

        document.getElementById('searchInput').addEventListener('input', updateView);

        // 初期実行
        updateView();
    </script>
</body>
</html>
