<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>山梨公園ナビ Pro - 距離順表示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        #side-panel { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; }
        @media (max-width: 767px) {
            #side-panel { transform: translateY(calc(100% - 60px)); height: 75vh; bottom: 0; width: 100%; }
            #side-panel.open { transform: translateY(0); }
        }
        @media (min-width: 768px) {
            #side-panel { transform: translateX(calc(100% - 40px)); width: 400px; right: 0; top: 0; height: 100vh; }
            #side-panel.open { transform: translateX(0); }
        }
        .focused-card { border: 2px solid #3b82f6; background-color: #f0f9ff; transform: scale(1.02); }
        .filter-chip:checked + label { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100">

    <div id="map"></div>

    <div id="side-panel" class="fixed bg-white shadow-2xl flex flex-col border-l border-t border-gray-200 open">
        <div onclick="togglePanel()" class="h-12 flex items-center justify-center cursor-pointer bg-gray-50 border-b shrink-0">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full md:rotate-90"></div>
        </div>

        <div class="flex-grow flex flex-col overflow-hidden">
            <div class="p-4 border-b bg-white">
                <h1 class="text-xl font-bold text-gray-800 mb-2 flex items-center gap-2">
                    <span class="text-blue-600 text-2xl">📍</span> 山梨公園ナビ
                </h1>

                <button onclick="getCurrentLocation()" class="w-full mb-3 py-2 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                    現在地から近い順に並び替え
                </button>
                
                <input type="text" id="searchInput" placeholder="公園名・市町村・住所で検索..." 
                       class="w-full p-3 bg-gray-100 rounded-xl mb-4 focus:ring-2 focus:ring-blue-400 outline-none border-none transition-all text-sm">

                <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                    <input type="checkbox" id="f-p" class="hidden filter-chip" onchange="updateUI()">
                    <label for="f-p" class="px-4 py-1.5 border border-gray-300 rounded-full text-xs font-bold whitespace-nowrap cursor-pointer transition-all">🚗 駐車場</label>
                    <input type="checkbox" id="f-t" class="hidden filter-chip" onchange="updateUI()">
                    <label for="f-t" class="px-4 py-1.5 border border-gray-300 rounded-full text-xs font-bold whitespace-nowrap cursor-pointer transition-all">🚾 トイレ</label>
                    <input type="checkbox" id="f-g" class="hidden filter-chip" onchange="updateUI()">
                    <label for="f-g" class="px-4 py-1.5 border border-gray-300 rounded-full text-xs font-bold whitespace-nowrap cursor-pointer transition-all">🛝 遊具</label>
                </div>
            </div>

            <div id="parkList" class="flex-grow overflow-y-auto p-4 space-y-4 bg-gray-50">
                <p class="text-center text-gray-400 py-10">読み込み中...</p>
            </div>
        </div>
    </div>

    <script>
        let parks = [];
        let map;
        let markerLayer;
        let userPos = null;

        async function loadParksData() {
            try {
                const response = await fetch('parks.json');
                parks = await response.json();
                initApp();
            } catch (error) {
                document.getElementById('parkList').innerHTML = `<p class="text-red-500 p-4 font-bold">Error: parks.jsonが見つかりません。</p>`;
            }
        }

        function initApp() {
            map = L.map('map', { zoomControl: false }).setView([35.665, 138.57], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            markerLayer = L.layerGroup().addTo(map);
            document.getElementById('searchInput').addEventListener('input', updateUI);
            updateUI();
        }

        // 現在地取得
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                alert("お使いのブラウザは位置情報に対応していません");
                return;
            }
            navigator.geolocation.getCurrentPosition(position => {
                userPos = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                // 地図に現在地を表示
                L.circle([userPos.lat, userPos.lng], {radius: 100, color: 'red'}).addTo(map);
                map.flyTo([userPos.lat, userPos.lng], 13);
                updateUI();
            }, () => {
                alert("位置情報の取得に失敗しました");
            });
        }

        // 2点間の距離計算 (km)
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function updateUI() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const pf = document.getElementById('f-p').checked;
            const tf = document.getElementById('f-t').checked;
            const gf = document.getElementById('f-g').checked;

            let filtered = parks.filter(p => {
                const matchSearch = (p.name?.includes(query)) || (p.address?.includes(query)) || (p.city?.includes(query));
                const matchParking = !pf || p.parking > 0;
                const matchToilet = !tf || p.toilet;
                const matchPlayground = !gf || p.playground;
                return matchSearch && matchParking && matchToilet && matchPlayground;
            });

            // 距離計算とソート
            if (userPos) {
                filtered.forEach(p => {
                    p.dist = getDistance(userPos.lat, userPos.lng, p.lat, p.lng);
                });
                filtered.sort((a, b) => a.dist - b.dist);
            }

            renderMarkers(filtered);
            renderList(filtered);
        }

        function renderMarkers(data) {
            markerLayer.clearLayers();
            data.forEach(p => {
                if (p.lat && p.lng) {
                    L.marker([p.lat, p.lng]).addTo(markerLayer).on('click', () => {
                        focusPark(p.id);
                        openPanel();
                    });
                }
            });
        }

        function renderList(data) {
            const container = document.getElementById('parkList');
            container.innerHTML = data.map(p => `
                <div id="card-${p.id}" onclick="moveMap(${p.lat}, ${p.lng}, '${p.id}')"
                     class="p-4 bg-white border border-gray-200 rounded-2xl cursor-pointer hover:shadow-md transition-all flex flex-col gap-2 shadow-sm">
                    <div class="flex justify-between items-start">
                        <span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded-md font-bold">${p.city || '山梨県'}</span>
                        ${p.dist ? `<span class="text-xs font-bold text-blue-600">📍 約${p.dist.toFixed(1)}km</span>` : ''}
                    </div>
                    <h3 class="font-bold text-gray-800 text-base">${p.name}</h3>
                    <p class="text-xs text-gray-500 line-clamp-1">${p.remarks || p.address || ''}</p>
                    <div class="flex gap-4 mt-1 border-t pt-2 border-gray-50">
                        <span class="text-xs ${p.parking > 0 ? 'text-blue-600 font-bold' : 'text-gray-300'}">🚗 ${p.parking > 0 ? p.parking + '台' : 'なし'}</span>
                        <span class="text-xs ${p.toilet ? 'text-green-600 font-bold' : 'text-gray-300'}">🚾 トイレ</span>
                        <span class="text-xs ${p.playground ? 'text-orange-600 font-bold' : 'text-gray-300'}">🛝 遊具</span>
                    </div>
                </div>
            `).join('');
        }

        function moveMap(lat, lng, id) {
            if (!lat || !lng) return;
            map.flyTo([lat, lng], 15);
            focusPark(id);
        }

        function focusPark(id) {
            document.querySelectorAll('.focused-card').forEach(c => c.classList.remove('focused-card'));
            const el = document.getElementById(`card-${id}`);
            if (el) { el.classList.add('focused-card'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }

        function togglePanel() { document.getElementById('side-panel').classList.toggle('open'); }
        function openPanel() { document.getElementById('side-panel').classList.add('open'); }

        loadParksData();
    </script>
</body>
</html>
