<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>甲府公園マップ・フリー版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        #side-panel { transition: transform 0.4s ease; z-index: 1000; }
        @media (max-width: 767px) {
            #side-panel { transform: translateY(calc(100% - 60px)); height: 70vh; bottom: 0; width: 100%; }
            #side-panel.open { transform: translateY(0); }
        }
        @media (min-width: 768px) {
            #side-panel { transform: translateX(calc(100% - 40px)); width: 380px; right: 0; top: 0; height: 100vh; }
            #side-panel.open { transform: translateX(0); }
        }
        .focused-card { border: 2px solid #3b82f6; background-color: #f0f9ff; }
        .filter-chip:checked + label { background-color: #3b82f6; color: white; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="side-panel" class="fixed bg-white shadow-2xl flex flex-col border-l border-t open">
        <div onclick="togglePanel()" class="h-12 flex items-center justify-center cursor-pointer bg-gray-50 border-b">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
        </div>

        <div class="flex-grow flex flex-col overflow-hidden">
            <div class="p-4 border-b">
                <h1 class="text-lg font-bold text-blue-800 mb-3">甲府公園コンシェルジュ</h1>
                <input type="text" id="searchInput" placeholder="公園を検索..." class="w-full p-2 bg-gray-100 rounded-lg mb-3 outline-none">
                <div class="flex gap-2 overflow-x-auto no-scrollbar">
                    <input type="checkbox" id="f-p" class="hidden filter-chip" onchange="updateUI()"><label for="f-p" class="px-3 py-1 border rounded-full text-xs cursor-pointer">🚗駐車場</label>
                    <input type="checkbox" id="f-t" class="hidden filter-chip" onchange="updateUI()"><label for="f-t" class="px-3 py-1 border rounded-full text-xs cursor-pointer">🚾トイレ</label>
                    <input type="checkbox" id="f-g" class="hidden filter-chip" onchange="updateUI()"><label for="f-g" class="px-3 py-1 border rounded-full text-xs cursor-pointer">🛝遊具</label>
                </div>
            </div>
            <div id="parkList" class="flex-grow overflow-y-auto p-4 space-y-3"></div>
        </div>
    </div>

    <script>
        // 前述の全39公園データをここに配置
        const parks = [
            { "id": "11-1", "name": "甲府駅北口多目的広場", "parking": 0, "toilet": true, "playground": false, "lat": 35.6675, "lng": 138.5694, "address": "北口2丁目" },
            { "id": "11-2", "name": "遊亀公園", "parking": 42, "toilet": true, "playground": true, "lat": 35.6515, "lng": 138.5746, "address": "太田町" },
            { "id": "11-3", "name": "玉諸公園", "parking": 25, "toilet": true, "playground": true, "lat": 35.6552, "lng": 138.6045, "address": "国玉町" }
            /* ...以下、11-39までリストを追加... */
        ];

        const map = L.map('map').setView([35.665, 138.57], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let markerLayer = L.layerGroup().addTo(map);

        function updateUI() {
            const s = document.getElementById('searchInput').value;
            const pf = document.getElementById('f-p').checked;
            const tf = document.getElementById('f-t').checked;
            const gf = document.getElementById('f-g').checked;

            const filtered = parks.filter(p => 
                p.name.includes(s) && (!pf || p.parking > 0) && (!tf || p.toilet) && (!gf || p.playground)
            );

            markerLayer.clearLayers();
            const list = document.getElementById('parkList');
            list.innerHTML = '';

            filtered.forEach(p => {
                const m = L.marker([p.lat, p.lng]).addTo(markerLayer);
                m.on('click', () => { focusPark(p.id); openPanel(); });

                list.innerHTML += `
                    <div id="card-${p.id}" onclick="moveMap(${p.lat}, ${p.lng}, '${p.id}')" class="p-4 bg-white border rounded-xl shadow-sm">
                        <h3 class="font-bold text-sm">${p.name}</h3>
                        <p class="text-xs text-gray-400">${p.address}</p>
                    </div>`;
            });
        }

        function moveMap(lat, lng, id) {
            map.flyTo([lat, lng], 17);
            focusPark(id);
        }

        function focusPark(id) {
            document.querySelectorAll('.focused-card').forEach(c => c.classList.remove('focused-card'));
            const el = document.getElementById(`card-${id}`);
            if(el) { el.classList.add('focused-card'); el.scrollIntoView({behavior:'smooth', block:'center'}); }
        }

        function togglePanel() { document.getElementById('side-panel').classList.toggle('open'); }
        function openPanel() { document.getElementById('side-panel').classList.add('open'); }

        document.getElementById('searchInput').addEventListener('input', updateUI);
        updateUI();
    </script>
</body>
</html>
