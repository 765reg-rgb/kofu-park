        function render(data) {
            const list = document.getElementById('parkList');
            list.innerHTML = data.map(p => `
                <div class="park-card bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex flex-col gap-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-blue-500 font-bold text-xs mb-1">NO.${p.id}</p>
                            <h2 class="text-lg font-bold leading-tight">${p.name}</h2>
                            <p class="text-sm text-gray-400 mt-1">📍 ${p.address}</p>
                        </div>
                        <div class="text-right">
                            <span class="bg-blue-50 text-blue-600 font-bold text-xs px-2 py-1 rounded-lg">${p.area.toLocaleString()}㎡</span>
                        </div>
                    </div>

                    <div class="flex gap-4 items-center bg-gray-50 p-3 rounded-xl">
                        <div class="flex flex-col items-center">
                            <span class="text-xl ${p.parking > 0 ? '' : 'grayscale opacity-30'}">🚗</span>
                            <span class="text-[10px] font-bold ${p.parking > 0 ? 'text-blue-600' : 'text-gray-300'}">${p.parking}台</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-xl ${p.toilet ? '' : 'grayscale opacity-30'}">🚾</span>
                            <span class="text-[10px] font-bold ${p.toilet ? 'text-green-600' : 'text-gray-300'}">${p.toilet ? 'あり' : 'なし'}</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-xl ${p.playground ? '' : 'grayscale opacity-30'}">🛝</span>
                            <span class="text-[10px] font-bold ${p.playground ? 'text-orange-600' : 'text-gray-300'}">${p.playground ? 'あり' : 'なし'}</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <span class="text-xl ${p.fountain ? '' : 'grayscale opacity-30'}">🚰</span>
                            <span class="text-[10px] font-bold ${p.fountain ? 'text-cyan-600' : 'text-gray-300'}">${p.fountain ? 'あり' : 'なし'}</span>
                        </div>
                    </div>

                    <button onclick="openNav('${p.name}')" class="bg-blue-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-100 active:bg-blue-700 transition-colors">
                        地図でルート案内
                    </button>
                </div>
            `).join('');
        }

        function filterParks(type) {
            document.querySelectorAll('header button').forEach(b => b.classList.remove('tab-active', 'text-gray-500'));
            document.getElementById('tab-' + type).classList.add('tab-active');

            let filtered = parks;
            if (type === 'parking') filtered = parks.filter(p => p.parking > 0);
            if (type === 'toilet') filtered = parks.filter(p => p.toilet);
            if (type === 'playground') filtered = parks.filter(p => p.playground);
            if (type === 'chibikko') filtered = parks.filter(p => p.name.includes('チビッコ'));

            render(filtered);
        }

        function openNav(name) {
            const url = `http://maps.apple.com/?q=${encodeURIComponent('甲府市 ' + name)}`;
            window.location.href = url;
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = parks.filter(p => p.name.includes(val) || p.address.includes(val));
            render(filtered);
        });

        // Initial Load
        render(parks);
    </script>
